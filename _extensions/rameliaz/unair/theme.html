<script>
// Single unified function to manage all logos
function manageLogos() {
  const allSections = document.querySelectorAll('.reveal .slides section');

  // Reveal.js wraps vertical sub-slide stacks in an outer <section> that also
  // matches the selector above. Skip those wrapper sections — only real
  // content slides (no nested <section> children) should get a logo, and
  // :scope keeps each slide's logo lookup from bleeding into its own stack
  // wrapper's descendant count.
  const slides = Array.from(allSections).filter(
    (s) => s.querySelectorAll(':scope > section').length === 0
  );

  slides.forEach(function(slide, index) {
    // Handle title slide (first slide)
    if (index === 0) {
      // Remove any regular logos from title slide
      const regularLogos = slide.querySelectorAll(':scope > .slide-logo');
      regularLogos.forEach(logo => logo.remove());

      // Add centered logo if it doesn't exist
      if (!slide.querySelector(':scope > .title-slide-logo')) {
        const titleLogo = document.createElement('img');
        titleLogo.src = 'libs/logo.png';
        titleLogo.className = 'title-slide-logo';
        titleLogo.alt = 'Universitas Airlangga Logo';
        slide.insertBefore(titleLogo, slide.firstChild);
      }
      return;
    }

    // For all other slides, ensure only ONE logo exists
    const existingLogos = slide.querySelectorAll(':scope > .slide-logo');

    // Check background color
    const bgColor = slide.getAttribute('data-background-color');
    const logoSrc = (bgColor === '#14497F' || bgColor === '#14497f')
      ? 'libs/logo_white.png'
      : 'libs/logo.png';

    // If multiple logos somehow exist, collapse to one
    if (existingLogos.length > 1) {
      existingLogos.forEach((logo, i) => { if (i > 0) logo.remove(); });
      existingLogos[0].src = logoSrc;
    }
    // If exactly one logo exists, just update its source
    else if (existingLogos.length === 1) {
      existingLogos[0].src = logoSrc;
    }
    // If no logo exists, create one
    else {
      const logo = document.createElement('img');
      logo.src = logoSrc;
      logo.className = 'slide-logo';
      logo.alt = 'Universitas Airlangga Logo';
      slide.appendChild(logo);
    }
  });
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  if (typeof Reveal !== 'undefined') {
    Reveal.on('ready', function() {
      manageLogos();
    });
  } else {
    setTimeout(manageLogos, 500);
  }
});

// Update when slides change
if (typeof Reveal !== 'undefined') {
  Reveal.on('slidechanged', function() {
    manageLogos();
  });
}
</script>

<style>
/* Additional inline styles for logo */
.reveal .slide-logo {
  position: absolute !important;
  top: -1em !important;  /* Aligns with title */
  right: 15px !important;
  max-height: 80px !important;
  max-width: 200px !important;
  z-index: 100 !important;
  object-fit: contain;
}

/* Ensure title slide doesn't have logo overlap */
.reveal .title-slide {
  padding-right: 220px;
}

/* Section title slide styling */
.reveal section[data-background-color] h1,
.reveal section[data-background-color] h2 {
  color: white !important;
}
</style>
